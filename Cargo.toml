[package]
name = "wckd-scry"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "See what is hiding on your disk. Fast search, storage maps, and guarded cleanup."
license = "MIT"

[[bin]]
name = "scry"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
libc = "0.2"
memmap2 = "0.9"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
regex = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
unicode-width = "0.2.2"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
incremental = false

