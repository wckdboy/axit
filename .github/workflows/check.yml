name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked --jobs 2 -- -D warnings
      - run: cargo test --locked --jobs 2 -- --test-threads=1
      - run: cargo build --release --examples --bin axit --locked --jobs 2
      - run: python3 scripts/protocol-test.py target/release/axit
      - run: sh scripts/installer-test.sh target/release/axit
      - name: Terminal keyboard and mouse integration
        run: |
          python3 -m venv .venv-ui
          .venv-ui/bin/pip install pyte==0.8.2
          .venv-ui/bin/python scripts/tui-test.py target/release/axit /tmp/axit-screens target/release/examples/apps_fixture
      - name: Static project site
        run: npm --prefix site run check

